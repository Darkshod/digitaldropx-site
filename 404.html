<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found — DigitalDropX</title>
  <style>
    :root { --bg: #ffffff; --fg: #0d0d0d; --muted: #6b7280; --accent: #10a37f; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .container { text-align: center; padding: 24px; }
    h1 { font-size: 72px; font-weight: 800; margin-bottom: 16px; }
    p { font-size: 18px; color: var(--muted); margin-bottom: 32px; }
    a { display: inline-block; background: var(--accent); color: white; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Page not found. Let's get you back on track.</p>
    <a href="/">Go Home</a>
  </div>
</body>
</html>
